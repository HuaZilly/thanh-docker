
########## 🔑 STORE MAPPING (VERY IMPORTANT) ##########
# Match domain -> Store View Code (must match Admin > Store View > Code)
map $host $MAGE_RUN_CODE {
    agrilink-m2.local       default;
}

######################################################

server {
    listen 80;
    server_name
       agrilink-m2.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name
       agrilink-m2.local;

    root /var/www/html/pub;
    index index.php;

    ssl_certificate     /etc/nginx/certs/agrilink-m2.local.pem;
    ssl_certificate_key /etc/nginx/certs/agrilink-m2.local-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Magento: fix 502 "upstream sent too big header"
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    client_max_body_size 64M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Access-Control-Allow-Origin "*" always;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location /static/ {
        location ~ ^/static/version {
            rewrite ^/static/(version\d*/)?(.*)$ /static/$2 last;
        }

        if (!-f $request_filename) {
            rewrite ^/static/?(.*)$ /static.php?resource=$1 last;
        }
    }

    location /media/ {
        try_files $uri $uri/ /get.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        ########## 🔒 FORCE STORE BY HOST ##########
        fastcgi_param MAGE_RUN_TYPE store;
        fastcgi_param MAGE_RUN_CODE $MAGE_RUN_CODE;
        ###########################################

        include fastcgi_params;
        fastcgi_read_timeout 1800;
    }
}
